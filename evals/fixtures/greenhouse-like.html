<!doctype html><html><head><title>Apply</title></head><body>
<!-- Mirrors the real Greenhouse form structure observed on 2026-10-17 -->
<form id="f">
  <div class="field"><label for="first_name">First Name<span>*</span></label><input id="first_name" required></div>
  <div class="field"><label for="last_name">Last Name<span>*</span></label><input id="last_name" required></div>
  <div class="field"><label for="email">Email<span>*</span></label><input id="email" type="email" required></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" type="tel"></div>
  <div class="field"><label id="country-label">Country*</label>
    <input id="country" role="combobox" aria-labelledby="country-label" aria-required="true" autocomplete="off">
    <input class="requiredInput" tabindex="-1" required style="opacity:0;width:1px;height:1px" value="">
    <ul id="country-list" hidden><li>United States</li><li>Canada</li><li>India</li></ul></div>
  <div class="field"><label>Resume/CV<span>*</span></label><button type="button">Attach</button><input type="file" id="resume" required aria-label="Attach" style="display:block"></div>
  <div class="field"><label>Cover Letter</label><input type="file" id="cover_letter" aria-label="Attach" style="display:block"></div>
  <div class="field"><label for="q1">LinkedIn Profile URL<span>*</span></label><input id="q1" required></div>
  <div class="field"><label for="q2">How did you hear about this job?</label><input id="q2"></div>
  <div class="field"><label for="q3">Do you now or will you in the future need sponsorship for employment visa status?*</label>
    <select id="q3" required><option>Select...</option><option>Yes</option><option>No</option></select></div>
  <div class="field"><label for="q4">Why do you want to work here?</label><textarea id="q4"></textarea></div>
  <fieldset><legend>Export control (voluntary)</legend>
    <label><input type="checkbox" name="exp" value="a"> Citizen or permanent resident of Cuba, Iran, North Korea, or Syria</label>
    <label><input type="checkbox" name="exp" value="b"> U.S. citizen</label></fieldset>
  <div class="grecaptcha-badge"><iframe src="about:blank#recaptcha/api2/anchor?size=invisible" width="256" height="60"></iframe></div>
  <button type="submit">Submit application</button>
</form>
<script>
const c = document.getElementById('country'), list = document.getElementById('country-list');
c.addEventListener('input', () => { list.hidden = false; });
c.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); const m=[...list.children].find(li => li.textContent.toLowerCase().startsWith(c.value.toLowerCase())); if (m) { c.value = m.textContent; document.querySelector('.requiredInput').value = m.textContent; } list.hidden = true; } });
document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault();
  const missing = [...document.querySelectorAll('[required]')].filter(el => el.type === 'file' ? !el.files.length : !el.value || el.value === 'Select...');
  if (missing.length) { document.body.insertAdjacentHTML('beforeend', '<p id=err>Missing: ' + missing.map(m=>m.id||m.className).join(',') + '</p>'); return; }
  window.__submitted = { resume: document.getElementById('resume').files[0].name, country: c.value, spons: document.getElementById('q3').value };
  document.body.innerHTML = '<h2>Thank you for applying!</h2><pre id=data>' + JSON.stringify(window.__submitted) + '</pre>'; });
</script></body></html>
